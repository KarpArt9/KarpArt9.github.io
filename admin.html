<!DOCTYPE HTML>
<html lang="ru">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Админ-панель – Райский холод</title>
    <link rel="stylesheet" href="https://maxcdn.bootstrapcdn.com/bootstrap/3.3.7/css/bootstrap.min.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/4.7.0/css/font-awesome.min.css">
    <style>
        body { background: #f0f7f4; font-family: 'Segoe UI', Roboto, sans-serif; padding: 20px 0; }
        .container { max-width: 1100px; }
        .login-box {
            background: #fff; border-radius: 24px; padding: 40px;
            box-shadow: 0 8px 30px rgba(0,0,0,0.08); max-width: 400px;
            margin: 100px auto; text-align: center;
        }
        .login-box h2 { color: #0d4a3a; margin-bottom: 20px; }
        .login-box .form-control { border-radius: 60px; padding: 12px 20px; }
        .login-box .btn { border-radius: 60px; background: #0d4a3a; color: #fff; padding: 12px 30px; }
        .login-box .btn:hover { background: #2ecc71; }
        .admin-panel { display: none; }
        .admin-header {
            background: #0d4a3a; color: #fff; padding: 15px 0;
            border-radius: 20px 20px 0 0;
        }
        .admin-header h2 { margin: 0; font-weight: 300; }
        .admin-header .logout { color: #2ecc71; cursor: pointer; }
        .admin-header .logout:hover { color: #fff; }
        .nav-tabs { border-bottom: 2px solid #2ecc71; }
        .nav-tabs > li.active > a { background: #2ecc71; color: #fff; border: none; border-radius: 20px 20px 0 0; }
        .nav-tabs > li > a { color: #0d4a3a; border: none; }
        .nav-tabs > li > a:hover { background: #d5f5e3; border: none; }
        .tab-content { background: #fff; padding: 30px; border-radius: 0 0 20px 20px; box-shadow: 0 8px 30px rgba(0,0,0,0.04); }
        .product-row { display: flex; align-items: center; padding: 8px 0; border-bottom: 1px solid #e8f0ec; gap: 15px; flex-wrap: wrap; }
        .product-row .name { flex: 2; min-width: 150px; font-weight: 500; }
        .product-row .image-upload { flex: 2; min-width: 200px; }
        .product-row .image-preview { max-width: 80px; max-height: 80px; border-radius: 8px; object-fit: cover; }
        .btn-sm { padding: 4px 12px; border-radius: 60px; }
        .status-msg { margin-top: 15px; font-weight: 500; }
        .status-msg.success { color: #2ecc71; }
        .status-msg.error { color: #e74c3c; }
        .add-product-form { background: #fafdfb; padding: 20px; border-radius: 16px; margin-bottom: 30px; border: 1px dashed #2ecc71; }
        .add-product-form .form-group { margin-bottom: 15px; }
        @media (max-width: 768px) { .product-row { flex-direction: column; align-items: stretch; } .product-row .name { text-align: center; } }
        #priceList table, #productManageList table { width: 100%; }
        #priceList td, #priceList th, #productManageList td, #productManageList th { padding: 8px; vertical-align: middle; }
        #priceList .price-input { width: 120px; }
        .loader { text-align: center; padding: 40px; color: #0d4a3a; }
        .save-indicator { position: fixed; top: 20px; right: 20px; padding: 12px 24px; border-radius: 60px; color: #fff; font-weight: 600; display: none; z-index: 9999; }
        .save-indicator.success { background: #2ecc71; }
        .save-indicator.error { background: #e74c3c; }
    </style>
</head>
<body>

<div class="save-indicator" id="saveIndicator"></div>

<div class="container" id="loginContainer">
    <div class="login-box">
        <h2><i class="fa fa-lock"></i> Вход в админку</h2>
        <form id="loginForm">
            <div class="form-group">
                <input type="password" class="form-control" id="adminPassword" placeholder="Введите пароль" required>
            </div>
            <button type="submit" class="btn btn-block">Войти</button>
        </form>
    </div>
</div>

<div class="container admin-panel" id="adminPanel">
    <div class="admin-header">
        <div class="row">
            <div class="col-xs-8">
                <h2><i class="fa fa-cog"></i> Панель управления</h2>
            </div>
            <div class="col-xs-4 text-right">
                <span class="logout" id="logoutBtn"><i class="fa fa-sign-out"></i> Выйти</span>
            </div>
        </div>
    </div>

    <ul class="nav nav-tabs" role="tablist">
        <li role="presentation" class="active"><a href="#tabPrices" aria-controls="tabPrices" role="tab" data-toggle="tab">Цены</a></li>
        <li role="presentation"><a href="#tabManage" aria-controls="tabManage" role="tab" data-toggle="tab">Управление товарами</a></li>
    </ul>

    <div class="tab-content">
        <div role="tabpanel" class="tab-pane active" id="tabPrices">
            <h3>Редактирование цен</h3>
            <div id="priceList"><div class="loader"><i class="fa fa-spinner fa-spin"></i> Загрузка...</div></div>
            <button class="btn btn-success" id="savePricesBtn"><i class="fa fa-save"></i> Сохранить все цены</button>
            <div id="priceStatus" class="status-msg"></div>
        </div>

        <div role="tabpanel" class="tab-pane" id="tabManage">
            <h3>Управление товарами</h3>
            <div class="add-product-form">
                <h4><i class="fa fa-plus-circle"></i> Добавить новый товар</h4>
                <form id="addProductForm" class="row">
                    <div class="col-sm-4">
                        <div class="form-group">
                            <label>Название товара</label>
                            <input type="text" class="form-control" id="newProductName" required>
                        </div>
                    </div>
                    <div class="col-sm-3">
                        <div class="form-group">
                            <label>Цена (₽)</label>
                            <input type="number" class="form-control" id="newProductPrice" required>
                        </div>
                    </div>
                    <div class="col-sm-3">
                        <div class="form-group">
                            <label>Бренд</label>
                            <input type="text" class="form-control" id="newProductBrand" placeholder="ballu, lg, hisense..." required>
                        </div>
                    </div>
                    <div class="col-sm-2">
                        <div class="form-group">
                            <label>Категория</label>
                            <select class="form-control" id="newProductCategory">
                                <option value="split">Сплит-системы</option>
                                <option value="vrf">VRF-системы</option>
                                <option value="fan_coil">Фанкойлы</option>
                                <option value="kkb">ККБ</option>
                                <option value="chiller">Чиллеры</option>
                                <option value="obvyazka">Обвязка</option>
                                <option value="ventilation">Вентиляция</option>
                            </select>
                        </div>
                    </div>
                    <div class="col-sm-12 text-right">
                        <button type="submit" class="btn btn-success"><i class="fa fa-plus"></i> Добавить товар</button>
                    </div>
                </form>
            </div>
            <div id="productManageList"><div class="loader"><i class="fa fa-spinner fa-spin"></i> Загрузка...</div></div>
            <div id="manageStatus" class="status-msg"></div>
        </div>
    </div>
</div>

<script src="https://code.jquery.com/jquery-3.7.1.min.js"></script>
<script src="https://maxcdn.bootstrapcdn.com/bootstrap/3.3.7/js/bootstrap.min.js"></script>

<script>
    // ==================== НАСТРОЙКИ ====================
    // ⬇️ ВСТАВЬ СВОИ ДАННЫЕ ⬇️
    const ADMIN_PASSWORD = 'admin123'; // Локальный пароль для входа в админку
    const GITHUB_TOKEN = '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'; // Твой GitHub токен
    const GITHUB_OWNER = 'KarpArt9'; // Твой GitHub username
    const GITHUB_REPO = 'KarpArt9.github.io'; // Название репозитория
    const PRODUCTS_FILE = 'products.json';
    // ⬆️ ВСТАВЬ СВОИ ДАННЫЕ ⬆️
    // =================================================

    let products = [];
    let currentSha = null; // Хэш текущего файла (нужен для обновления)

    // ------------------ Вход / Выход ------------------
    function checkAuth() {
        if (sessionStorage.getItem('adminLogged') === 'true') {
            document.getElementById('loginContainer').style.display = 'none';
            document.getElementById('adminPanel').style.display = 'block';
            loadProducts();
        } else {
            document.getElementById('loginContainer').style.display = 'block';
            document.getElementById('adminPanel').style.display = 'none';
        }
    }

    document.getElementById('loginForm').addEventListener('submit', function(e) {
        e.preventDefault();
        const pass = document.getElementById('adminPassword').value;
        if (pass === ADMIN_PASSWORD) {
            sessionStorage.setItem('adminLogged', 'true');
            checkAuth();
        } else {
            alert('Неверный пароль!');
        }
    });

    document.getElementById('logoutBtn').addEventListener('click', function() {
        sessionStorage.removeItem('adminLogged');
        checkAuth();
    });

    // ------------------ GitHub API ------------------
    async function loadProducts() {
        try {
            const response = await fetch(`https://api.github.com/repos/${GITHUB_OWNER}/${GITHUB_REPO}/contents/${PRODUCTS_FILE}`, {
                headers: {
                    'Authorization': `token ${GITHUB_TOKEN}`,
                    'Accept': 'application/vnd.github.v3+json'
                }
            });

            if (!response.ok) {
                throw new Error(`GitHub API error: ${response.status}`);
            }

            const data = await response.json();
            currentSha = data.sha; // Запоминаем SHA для последующего обновления
            
            // Декодируем base64
            const content = atob(data.content);
            products = JSON.parse(content);
            
            refreshAll();
        } catch (err) {
            console.error('Ошибка загрузки:', err);
            document.getElementById('priceList').innerHTML = '<div class="status-msg error">❌ Ошибка загрузки товаров. Проверь консоль (F12).</div>';
        }
    }

    async function saveProducts() {
        try {
            const content = btoa(unescape(encodeURIComponent(JSON.stringify(products, null, 2))));
            
            const response = await fetch(`https://api.github.com/repos/${GITHUB_OWNER}/${GITHUB_REPO}/contents/${PRODUCTS_FILE}`, {
                method: 'PUT',
                headers: {
                    'Authorization': `token ${GITHUB_TOKEN}`,
                    'Accept': 'application/vnd.github.v3+json',
                    'Content-Type': 'application/json'
                },
                body: JSON.stringify({
                    message: `Update products (${new Date().toLocaleString('ru')})`,
                    content: content,
                    sha: currentSha
                })
            });

            if (!response.ok) {
                throw new Error(`GitHub API error: ${response.status}`);
            }

            const data = await response.json();
            currentSha = data.content.sha; // Обновляем SHA
            
            showSaveIndicator('✅ Сохранено!', 'success');
            return true;
        } catch (err) {
            console.error('Ошибка сохранения:', err);
            showSaveIndicator('❌ Ошибка сохранения!', 'error');
            return false;
        }
    }

    function showSaveIndicator(message, type) {
        const indicator = document.getElementById('saveIndicator');
        indicator.textContent = message;
        indicator.className = 'save-indicator ' + type;
        indicator.style.display = 'block';
        setTimeout(() => { indicator.style.display = 'none'; }, 3000);
    }

    // ------------------ Рендеринг ------------------
    function renderPrices() {
        const container = document.getElementById('priceList');
        if (products.length === 0) {
            container.innerHTML = '<p class="text-muted">Нет товаров.</p>';
            return;
        }
        let html = '<table><thead><tr><th>Товар</th><th>Текущая цена</th><th>Новая цена</th></tr></thead><tbody>';
        products.forEach(p => {
            html += `<tr>
                <td><strong>${escapeHtml(p.name)}</strong> <span class="text-muted">(${p.id})</span></td>
                <td>${p.price} ₽</td>
                <td><input type="number" class="form-control input-sm price-input" data-id="${p.id}" value="${p.price}"></td>
            </tr>`;
        });
        html += '</tbody></table>';
        container.innerHTML = html;
    }

    function renderProductManage() {
        const container = document.getElementById('productManageList');
        if (products.length === 0) {
            container.innerHTML = '<p class="text-muted">Нет товаров.</p>';
            return;
        }
        let html = '<table><thead><tr><th>Название</th><th>Цена</th><th>Бренд</th><th>Категория</th><th>Действия</th></tr></thead><tbody>';
        products.forEach((p, index) => {
            html += `<tr>
                <td>${escapeHtml(p.name)}</td>
                <td>${p.price} ₽</td>
                <td>${escapeHtml(p.brand || '-')}</td>
                <td>${escapeHtml(p.category || '-')}</td>
                <td><button class="btn btn-danger btn-sm delete-product" data-index="${index}"><i class="fa fa-trash"></i> Удалить</button></td>
            </tr>`;
        });
        html += '</tbody></table>';
        container.innerHTML = html;
    }

    function escapeHtml(str) {
        if (!str) return '';
        return String(str).replace(/[&<>"']/g, m => ({
            '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;'
        }[m]));
    }

    function refreshAll() {
        renderPrices();
        renderProductManage();
    }

    // ------------------ Обработчики ------------------
    document.getElementById('savePricesBtn').addEventListener('click', async function() {
        const btn = this;
        btn.disabled = true;
        btn.innerHTML = '<i class="fa fa-spinner fa-spin"></i> Сохранение...';
        
        const inputs = document.querySelectorAll('.price-input');
        let changed = 0;
        inputs.forEach(input => {
            const id = input.dataset.id;
            const val = parseInt(input.value);
            if (!isNaN(val)) {
                const product = products.find(p => p.id === id);
                if (product && product.price !== val) {
                    product.price = val;
                    changed++;
                }
            }
        });

        if (changed === 0) {
            document.getElementById('priceStatus').textContent = '⚠️ Изменений нет';
            document.getElementById('priceStatus').className = 'status-msg';
            btn.disabled = false;
            btn.innerHTML = '<i class="fa fa-save"></i> Сохранить все цены';
            return;
        }

        const success = await saveProducts();
        
        if (success) {
            document.getElementById('priceStatus').textContent = `✅ Сохранено ${changed} товаров! GitHub обновит сайт через 1-5 минут.`;
            document.getElementById('priceStatus').className = 'status-msg success';
        } else {
            document.getElementById('priceStatus').textContent = '❌ Ошибка сохранения!';
            document.getElementById('priceStatus').className = 'status-msg error';
        }
        
        btn.disabled = false;
        btn.innerHTML = '<i class="fa fa-save"></i> Сохранить все цены';
        setTimeout(() => { document.getElementById('priceStatus').textContent = ''; }, 5000);
    });

    document.addEventListener('click', async function(e) {
        // Удаление товара
        if (e.target.classList.contains('delete-product') || e.target.closest('.delete-product')) {
            const btn = e.target.closest('.delete-product');
            const index = parseInt(btn.dataset.index);
            if (!confirm('Удалить этот товар?')) return;
            
            products.splice(index, 1);
            const success = await saveProducts();
            if (success) {
                refreshAll();
            }
        }
    });

    // Добавление товара
    document.getElementById('addProductForm').addEventListener('submit', async function(e) {
        e.preventDefault();
        const name = document.getElementById('newProductName').value.trim();
        const price = parseInt(document.getElementById('newProductPrice').value);
        const brand = document.getElementById('newProductBrand').value.trim().toLowerCase();
        const category = document.getElementById('newProductCategory').value;
        
        const btn = this.querySelector('button[type="submit"]');
        btn.disabled = true;
        btn.innerHTML = '<i class="fa fa-spinner fa-spin"></i> Добавление...';

        const newId = 'prod_' + Date.now() + '_' + Math.random().toString(36).substr(2, 5);
        const newProduct = {
            id: newId,
            name: name,
            price: price,
            brand: brand,
            category: category,
            area: null,
            type: 'standard',
            features: [],
            specs: {}
        };

        products.push(newProduct);
        const success = await saveProducts();
        
        if (success) {
            refreshAll();
            this.reset();
            document.getElementById('manageStatus').textContent = '✅ Товар добавлен! GitHub обновит сайт через 1-5 минут.';
            document.getElementById('manageStatus').className = 'status-msg success';
            setTimeout(() => { document.getElementById('manageStatus').textContent = ''; }, 5000);
        }
        
        btn.disabled = false;
        btn.innerHTML = '<i class="fa fa-plus"></i> Добавить товар';
    });

    // Переключение вкладок
    $('a[data-toggle="tab"]').on('shown.bs.tab', function (e) {
        const target = $(e.target).attr('href');
        if (target === '#tabPrices') renderPrices();
        if (target === '#tabManage') renderProductManage();
    });

    // Запуск
    checkAuth();
</script>
</body>
</html>
